name: template
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 -B scripts/check_template.py
      - run: python3 -B scripts/search.py --self-test
      - run: python3 -B scripts/health.py --self-test
      - run: python3 -B scripts/eval_human.py --self-test
      - run: python3 -B scripts/demo.py
      - run: python3 -B scripts/test_transaction.py
      - run: git diff --exit-code

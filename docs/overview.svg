<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title description">
  <title id="title">Litwiki: from papers to cited answers</title>
  <desc id="description">PDFs and metadata become page-marked text, linked notes and claims, and visible source health. For a real question, litwiki finds relevant material, checks the original page, and returns a citation or says the answer is not in the knowledge base.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1">
      <stop stop-color="#f7fbfe"/>
      <stop offset="1" stop-color="#f3f9fb"/>
    </linearGradient>
    <linearGradient id="source" x2="1" y2="0">
      <stop stop-color="#e9faf5"/>
      <stop offset="1" stop-color="#edf8fc"/>
    </linearGradient>
    <linearGradient id="answer" x2="1" y2="0">
      <stop stop-color="#eff5ff"/>
      <stop offset="1" stop-color="#f2f4ff"/>
    </linearGradient>
    <marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#19a99c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#5b83d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="608" rx="28" fill="url(#canvas)" stroke="#dae5ed" stroke-width="2"/>
  <circle cx="72" cy="70" r="24" fill="#143f52"/>
  <path d="M61 64 L72 59 L83 64 L72 69 Z M61 70 L72 75 L83 70 M61 77 L72 82 L83 77" fill="none" stroke="#83e5d3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="111" y="78" fill="#15394d" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="34" letter-spacing="-1">litwiki</text>
  <text x="272" y="76" fill="#476273" font-family="Arial, Helvetica, sans-serif" font-size="20">From papers to cited answers.</text>
  <rect x="942" y="48" width="208" height="40" rx="20" fill="#ffffff" stroke="#c6dce3"/>
  <circle cx="964" cy="68" r="5" fill="#14a68f"/>
  <text x="980" y="74" fill="#315769" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16">WORKFLOW ONLY</text>

  <rect x="34" y="116" width="1132" height="204" rx="23" fill="url(#source)" stroke="#c9e8e3" stroke-width="1.5"/>
  <rect x="51" y="134" width="11" height="11" rx="3" fill="#17a99b"/>
  <text x="71" y="146" fill="#24766f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">01  BUILD A TRACEABLE LIBRARY</text>
  <text x="792" y="146" fill="#5c7c86" font-family="Arial, Helvetica, sans-serif" font-size="15">Your papers stay in your own vault</text>

  <g fill="#ffffff" stroke="#cddfe3" stroke-width="1.5">
    <rect x="52" y="166" width="246" height="135" rx="16"/>
    <rect x="334" y="166" width="246" height="135" rx="16"/>
    <rect x="616" y="166" width="246" height="135" rx="16"/>
    <rect x="898" y="166" width="246" height="135" rx="16"/>
  </g>
  <g fill="#19a99c">
    <rect x="52" y="166" width="246" height="5" rx="2"/>
    <rect x="334" y="166" width="246" height="5" rx="2"/>
    <rect x="616" y="166" width="246" height="5" rx="2"/>
    <rect x="898" y="166" width="246" height="5" rx="2"/>
  </g>
  <g fill="none" stroke="#18a89a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79 191 h24 l7 7 v26 H79 Z M103 191 v8 h7 M85 210 h17 M85 216 h14"/>
    <path d="M362 191 h24 l7 7 v26 h-31 Z M367 208 h19 M367 215 h16"/>
    <path d="M644 197 h17 l6 5 h17 v22 h-40 Z M650 210 h26 M650 216 h21"/>
    <path d="M927 202 l10 5 l10-5 l10 5 v12 l-10 5 l-10-5 l-10 5 Z M937 207 v12 M947 202 v17 M957 207 v12"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#18384a">
    <text x="79" y="251" font-size="22" font-weight="700">Paper input</text>
    <text x="361" y="251" font-size="22" font-weight="700">Page extraction</text>
    <text x="643" y="251" font-size="22" font-weight="700">Linked knowledge</text>
    <text x="925" y="251" font-size="22" font-weight="700">Source health</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#58727e" font-size="16">
    <text x="79" y="278">PDF + metadata</text>
    <text x="361" y="278">Text with page markers</text>
    <text x="643" y="278">Notes · claims · topic maps</text>
    <text x="925" y="278">Versions · pending work</text>
  </g>
  <g fill="none" stroke="#19a99c" stroke-width="2.8" stroke-linecap="round" marker-end="url(#teal-arrow)">
    <path d="M303 233 H327"/>
    <path d="M585 233 H609"/>
    <path d="M867 233 H891"/>
  </g>

  <rect x="34" y="339" width="1132" height="204" rx="23" fill="url(#answer)" stroke="#d4def3" stroke-width="1.5"/>
  <rect x="51" y="357" width="11" height="11" rx="3" fill="#5b83d6"/>
  <text x="71" y="369" fill="#5270b4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">02  ANSWER A REAL QUESTION</text>
  <text x="802" y="369" fill="#697b9e" font-family="Arial, Helvetica, sans-serif" font-size="15">Original pages are the authority</text>
  <g fill="#ffffff" stroke="#d8dfed" stroke-width="1.5">
    <rect x="52" y="389" width="246" height="135" rx="16"/>
    <rect x="334" y="389" width="246" height="135" rx="16"/>
    <rect x="616" y="389" width="246" height="135" rx="16"/>
    <rect x="898" y="389" width="246" height="135" rx="16"/>
  </g>
  <g fill="#5b83d6">
    <rect x="52" y="389" width="246" height="5" rx="2"/>
    <rect x="334" y="389" width="246" height="5" rx="2"/>
    <rect x="616" y="389" width="246" height="5" rx="2"/>
    <rect x="898" y="389" width="246" height="5" rx="2"/>
  </g>
  <g fill="none" stroke="#5b83d6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="89" cy="422" r="12"/><path d="M81 422 h16 M89 414 v16 M78 439 h22"/>
    <circle cx="373" cy="421" r="10"/><path d="M380 428 l9 9 M366 421 h13"/>
    <path d="M646 414 h21 l6 6 v18 h-27 Z M667 414 v7 h6 M652 426 h15 M652 432 h11"/>
    <path d="M928 416 h23 v20 h-23 Z M933 425 l5 5 l9-10"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#18384a">
    <text x="79" y="474" font-size="22" font-weight="700">Ask</text>
    <text x="361" y="474" font-size="22" font-weight="700">Find</text>
    <text x="643" y="474" font-size="22" font-weight="700">Verify</text>
    <text x="925" y="474" font-size="22" font-weight="700">Answer</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#64768f" font-size="16">
    <text x="79" y="501">Your research question</text>
    <text x="361" y="501">Search notes + claims</text>
    <text x="643" y="501">Read source page + context</text>
    <text x="925" y="501">Cite [[paperKey]] p.12</text>
  </g>
  <g fill="none" stroke="#5b83d6" stroke-width="2.8" stroke-linecap="round" marker-end="url(#blue-arrow)">
    <path d="M303 456 H327"/>
    <path d="M585 456 H609"/>
    <path d="M867 456 H891"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
    <rect x="34" y="560" width="334" height="32" rx="16" fill="#e2f6f1"/>
    <text x="53" y="582" fill="#267d73">✓ Different views stay visible</text>
    <rect x="383" y="560" width="360" height="32" rx="16" fill="#e7eefc"/>
    <text x="402" y="582" fill="#4f6eaf">✓ Unfinished integration is visible</text>
    <rect x="758" y="560" width="408" height="32" rx="16" fill="#eaf0f2"/>
    <text x="777" y="582" fill="#466473">✓ Missing evidence: say so, don't guess</text>
  </g>
</svg>
